name: diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  win-fuzz:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Seed hang stack dump
        env:
          GOTRACEBACK: all
        run: go test -v -count=1 -timeout 30m ./internal/hook/policy/
