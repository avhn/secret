name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  standalone-install-unix:
    name: standalone installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Standalone installer synthetic transport and trust regressions
        run: bash tests/test-install.sh
      - name: Retained stock Bash 3.2 standalone installer regressions
        if: runner.os == 'macOS'
        run: /bin/bash tests/test-install.sh

  standalone-install-windows:
    name: standalone installer (Windows, ${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Parse new installer and release integration scripts
        shell: pwsh
        env:
          POWERSHELL_EDITION: ${{ matrix.shell }}
        run: |
          $edition = (Get-Command $env:POWERSHELL_EDITION -CommandType Application -TotalCount 1).Source
          & $edition -NoProfile -NonInteractive -Command {
            foreach ($path in @('install.ps1', 'tests/test-install.ps1', 'tests/test-release-windows.ps1')) {
              $tokens = $null
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path), [ref]$tokens, [ref]$errors)
              if ($errors.Count -ne 0) { throw 'PowerShell release script has parser errors' }
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native standalone installer synthetic regressions
        shell: pwsh
        env:
          POWERSHELL_EDITION: ${{ matrix.shell }}
        run: |
          $edition = (Get-Command $env:POWERSHELL_EDITION -CommandType Application -TotalCount 1).Source
          & $edition -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/test-install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  packaging-and-setup:
    name: MCPB, registry and setup regressions
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Install locked MCPB tooling in disposable roots without lifecycle scripts
        run: |
          root="$(mktemp -d "$RUNNER_TEMP/packaging.XXXXXX")"
          mkdir -m 700 "$root/home" "$root/tmp"
          export HOME="$root/home" TMPDIR="$root/tmp"
          npm install --global --prefix "$root/tools" --ignore-scripts --no-audit --no-fund npm@11.19.1
          export PATH="$root/tools/bin:$PATH"
          test "$(npm --version)" = 11.19.1
          npm ci --ignore-scripts --prefix packaging/mcpb
          printf 'HOME=%s\nTMPDIR=%s\n' "$HOME" "$TMPDIR" >> "$GITHUB_ENV"
          printf '%s\n' "$root/tools/bin" >> "$GITHUB_PATH"
      - name: MCPB allowlist, determinism and metadata-only smoke
        run: python3 -I tests/test-mcpb.py
      - name: Fresh npm audit through the reviewed MCPB advisory policy
        run: |
          report="$TMPDIR/npm-audit.json"
          status=0
          npm audit --prefix packaging/mcpb --ignore-scripts --json > "$report" || status=$?
          case "$status" in 0|1) ;; *) echo "npm audit failed with status $status" >&2; exit 1 ;; esac
          python3 -I scripts/package_mcpb.py --version 0.3.4 --audit-report "$report"
      - name: Registry generation and publication contract without external publication
        run: python3 -I tests/test-registry.py
      - name: Setup examples and exact synthetic argv
        run: python3 -I tests/test-setup.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck compat/secret bin/secret hooks/guard-secrets hooks/guard-go scripts/*.sh tests/*.sh testdata/store/gen.sh testdata/cli/gen.sh
      - name: Reject shipped release fixture marker
        run: |
          test ! -e .secret-release-test-fixture
          test ! -L .secret-release-test-fixture
          test -z "$(git ls-files -- .secret-release-test-fixture)"
      - name: Offline synthetic host classification (no model calls)
        run: python3 -I tests/test-host-hooks.py
      - run: python3 -I tests/test-go-divergence.py
      - run: python3 -I tests/test-go-hook-divergence.py
      - run: python3 -I tests/test-hook-variants.py
      - run: python3 -I tests/test-inventory.py

  libsecret:
    name: libsecret (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Secret Service test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Build Go CLI for provider suite
        run: go build -o "$RUNNER_TEMP/secret" ./cmd/secret
      - name: Go libsecret suite
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: bash tests/go-cli.sh libsecret "$RUNNER_TEMP/secret"
      - name: Isolated libsecret suite
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: SECRET_TEST_INVENTORY="$RUNNER_TEMP/libsecret-cases.tsv" bash tests/test-libsecret.sh
      - name: Isolated Go libsecret integration
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: go test -v ./internal/backend -run '^(TestLibsecretIntegration|TestOperatorLibsecretIntegration)$' -count=1
      - name: Check libsecret inventory
        run: bash tests/inventory.sh --check --suite libsecret

  keychain:
    name: keychain (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Identify missing Keychain inventory
        id: missing_keychain
        run: |
          if [ ! -f testdata/inventory/keychain.tsv ]; then echo "missing=true" >>"$GITHUB_OUTPUT"; fi
      - name: Build Go CLI for provider suite
        run: go build -o "$RUNNER_TEMP/secret" ./cmd/secret
      - name: Go Keychain suite
        env:
          SECRET_REQUIRE_KEYCHAIN: "1"
        run: bash tests/go-cli.sh keychain "$RUNNER_TEMP/secret"
      - name: Isolated Keychain suite
        run: SECRET_TEST_INVENTORY="$RUNNER_TEMP/keychain-cases.tsv" SECRET_REQUIRE_KEYCHAIN=1 /bin/bash tests/test-keychain.sh
      - name: Isolated Go Keychain integration
        env:
          SECRET_REQUIRE_KEYCHAIN: "1"
        run: go test -v ./internal/backend -run '^(TestKeychainIntegration|TestOperatorKeychainIntegration)$' -count=1
      - name: Check keychain inventory
        env:
          SECRET_INVENTORY_STRICT: "1"
        run: BASH_BIN=/bin/bash /bin/bash tests/inventory.sh --check --suite keychain
      - name: Generate missing keychain inventory artifact
        if: steps.missing_keychain.outputs.missing == 'true'
        run: BASH_BIN=/bin/bash /bin/bash tests/inventory.sh --write --suite keychain
      - uses: actions/upload-artifact@v4
        if: steps.missing_keychain.outputs.missing == 'true'
        with:
          name: keychain-inventory
          path: testdata/inventory/keychain.tsv
          if-no-files-found: error

  pass:
    name: pass (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - name: Install pass prerequisites and select native tools
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install gnupg bash gnu-getopt
            brew_prefix="$(brew --prefix)"
            echo "SECRET_PASS_TOOL_PATH=$brew_prefix/bin:$brew_prefix/sbin:$brew_prefix/opt/gnu-getopt/bin:/usr/bin:/bin" >>"$GITHUB_ENV"
            echo "SECRET_PASS_BASH=$brew_prefix/bin/bash" >>"$GITHUB_ENV"
            echo "SECRET_PASS_GETOPT=$brew_prefix/opt/gnu-getopt/bin/getopt" >>"$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y gnupg bash coreutils util-linux tree git curl make xz-utils
            echo "SECRET_PASS_TOOL_PATH=/usr/bin:/bin" >>"$GITHUB_ENV"
            echo "SECRET_PASS_BASH=/usr/bin/bash" >>"$GITHUB_ENV"
          fi
          echo "SECRET_PASS_PREFIX=$RUNNER_TEMP/pass-1.7.4" >>"$GITHUB_ENV"
      - name: Install checksum-pinned upstream pass with platform file
        shell: bash
        run: PATH="$SECRET_PASS_TOOL_PATH:$PATH" sh scripts/install-test-pass.sh "$SECRET_PASS_PREFIX"
      - name: Build staged Go CLI
        run: go build -o "$RUNNER_TEMP/secret" ./cmd/secret
      - name: Isolated native pass and operator matrix
        shell: bash
        run: |
          # Keep the pinned setup-go toolchain ahead of any runner image Go in /usr/bin.
          go_bin=$(go env GOROOT)/bin
          PATH="$SECRET_PASS_PREFIX/bin:$go_bin:$SECRET_PASS_TOOL_PATH:$PATH" python3 -I tests/test-pass.py "$RUNNER_TEMP/secret"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bash ripgrep; else sudo apt-get install -y ripgrep; fi
      # Explicit path: macOS runners put stock /bin/bash 3.2 first on PATH.
      - name: Select current bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then echo "BASH_BIN=$(brew --prefix)/bin/bash" >>"$GITHUB_ENV"; else echo "BASH_BIN=bash" >>"$GITHUB_ENV"; fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go CLI suites
        run: |
          go build -o "$RUNNER_TEMP/secret" ./cmd/secret
          go build -tags secretstub -o "$RUNNER_TEMP/secret-stub" ./cmd/secret
      - name: Offline host fault fixtures (no model calls)
        run: |
          go build -tags hosthookfixture -o "$RUNNER_TEMP/host-hook-fixture" tests/host-hook-fixture.go
          python3 -I tests/test-host-hooks.py --fixture "$RUNNER_TEMP/host-hook-fixture"
      - name: Release synthetic regressions
        run: python3 -I tests/test-release.py
      - name: Release launcher matrix (current Bash)
        run: '"$BASH_BIN" tests/test-launchers.sh'
      - name: Offline 1Password fake-op and detached PTY contract
        run: python3 -I tests/test-onepassword.py
      - name: Go age terminal and killed-writer integration
        run: python3 -I tests/test-age.py "$RUNNER_TEMP/secret"
      - name: Go operator terminal integration
        run: python3 -I tests/test-operator.py "$RUNNER_TEMP/secret"
      - name: Go CLI matrix
        run: BASH_BIN="$BASH_BIN" bash tests/go-cli.sh secret "$RUNNER_TEMP/secret"
      - name: Go backend matrix
        run: BASH_BIN="$BASH_BIN" bash tests/go-cli.sh backends "$RUNNER_TEMP/secret-stub"
      - name: CLI matrix
        run: '"$BASH_BIN" tests/test-secret.sh'
      - name: Bash compatibility identity and broken final launcher
        run: 'BASH_BIN="$BASH_BIN" "$BASH_BIN" tests/test-compat.sh'
      - name: Backend matrix
        run: '"$BASH_BIN" tests/test-backends.sh'
      - name: Guard matrix
        run: '"$BASH_BIN" tests/test-guard.sh'
      - name: Codex guard matrix
        run: '"$BASH_BIN" tests/test-codex.sh'
      - name: Guard Git context cache
        run: '"$BASH_BIN" tests/test-guard-context.sh'
      - name: Go Claude hook divergence matrix
        if: runner.os == 'Linux'
        run: BASH_BIN="$BASH_BIN" bash tests/go-hook.sh guard "$RUNNER_TEMP/secret" claude
      - name: Go Codex hook divergence matrix
        if: runner.os == 'Linux'
        run: BASH_BIN="$BASH_BIN" bash tests/go-hook.sh codex "$RUNNER_TEMP/secret" codex
      - name: Check synthetic inventory
        run: BASH_BIN="$BASH_BIN" bash tests/inventory.sh --check
      - name: Stock bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash tests/test-secret.sh
          /bin/bash tests/test-backends.sh
          /bin/bash tests/test-guard.sh
          /bin/bash tests/test-codex.sh
          /bin/bash tests/test-guard-context.sh
          BASH_BIN=/bin/bash /bin/bash tests/test-compat.sh
          BASH_BIN=/bin/bash bash tests/inventory.sh --check

  windows-cli:
    name: windows native cli and credman
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      SECRET_REQUIRE_WINCRED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - name: Parse isolated Windows harness
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'tests/test-windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) { throw 'Windows harness has parser errors' }
      - name: Build fresh native CLI and test-only console fixture
        id: native_build
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'secret native build'
          if (Test-Path -LiteralPath $build) { throw 'native build directory already exists' }
          $null = New-Item -ItemType Directory -Path $build
          go build -trimpath -o (Join-Path $build 'secret.exe') ./cmd/secret
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags windowsfixture -o (Join-Path $build 'windows-fixture.exe') ./testdata/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags windowsfixture -count=1 ./testdata/windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required exact CredMan blob and transaction lifecycle
        shell: pwsh
        run: |
          $env:SECRET_WINCRED_TARGETS = Join-Path $env:RUNNER_TEMP 'secret-wincred-targets.jsonl'
          if (Test-Path -LiteralPath $env:SECRET_WINCRED_TARGETS) { throw 'cleanup journal already exists' }
          go test -v -count=1 -run '^TestWincred(Integration|TransactionIntegration)$' ./internal/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required isolated cmd and PowerShell CLI matrix
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'secret native build'
          & ./tests/test-windows.ps1 -SecretExe (Join-Path $build 'secret.exe') -ConsoleFixture (Join-Path $build 'windows-fixture.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently verify CLI exact-target cleanup
        if: always() && steps.native_build.outcome == 'success'
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'secret native build'
          & ./tests/test-windows.ps1 -SecretExe (Join-Path $build 'secret.exe') -ConsoleFixture (Join-Path $build 'windows-fixture.exe') -CleanupOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently verify provider exact-target cleanup
        if: always()
        shell: pwsh
        run: |
          $env:SECRET_WINCRED_TARGETS = Join-Path $env:RUNNER_TEMP 'secret-wincred-targets.jsonl'
          go test -v -count=1 -run '^TestWincredCleanup$' ./internal/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  powershell-oracle:
    name: powershell oracle (${{ matrix.edition }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [Desktop, Core]
    env:
      GOTOOLCHAIN: local
      SECRET_PS_ORACLE_BUDGET: "2000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.mod
      - name: Record native image and toolchain
        shell: pwsh
        run: |
          Write-Output "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          Write-Output ([Environment]::OSVersion.VersionString)
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify and extract pinned official PowerShell Core
        if: matrix.edition == 'Core'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'powershell-oracle-download'
          $extract = Join-Path $env:RUNNER_TEMP 'powershell-oracle-7.6.7'
          foreach ($directory in @($download, $extract)) {
            if (Test-Path -LiteralPath $directory) { throw 'Oracle asset directory already exists' }
            $null = New-Item -ItemType Directory -Path $directory
          }
          $zip = Join-Path $download 'PowerShell-7.6.7-win-x64.zip'
          Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.7/PowerShell-7.6.7-win-x64.zip' -OutFile $zip
          $expected = 'd2f952ebdbf24386cb8923553aa58e41a846db35a6155ea04c58142a4b16dbb7'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "PowerShell-7.6.7-win-x64.zip SHA256=$actual"
          if ($actual -ne $expected) { throw 'Pinned PowerShell SHA-256 mismatch' }
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
      - name: Required inbox Windows PowerShell 5.1 oracle
        if: matrix.edition == 'Desktop'
        shell: pwsh
        run: |
          $oracle = 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
          & $oracle -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/test-powershell.ps1 -Edition Desktop -Oracle $oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Required checksum-pinned PowerShell 7.6.7 oracle
        if: matrix.edition == 'Core'
        shell: pwsh
        # The runner's pwsh orchestrates only; it is never the Core oracle.
        run: |
          $oracle = Join-Path $env:RUNNER_TEMP 'powershell-oracle-7.6.7\pwsh.exe'
          & $oracle -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ./tests/test-powershell.ps1 -Edition Core -Oracle $oracle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  go:
    name: go (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: go.mod
      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Verify module cache
        shell: bash
        run: go mod verify
      - name: Vet Go packages
        shell: bash
        run: go vet ./...
      - name: Test explicit backend stub build
        shell: bash
        run: go test -tags secretstub -count=1 ./internal/backend
      - name: Exact disposable Windows Credential Manager lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          SECRET_REQUIRE_WINCRED: "1"
        run: |
          $env:SECRET_WINCRED_TARGETS = Join-Path $env:RUNNER_TEMP 'secret-wincred-targets.jsonl'
          if (Test-Path -LiteralPath $env:SECRET_WINCRED_TARGETS) { throw 'cleanup journal already exists' }
          go test -v -count=1 -run '^TestWincred(Integration|TransactionIntegration)$' ./internal/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify exact Windows credential cleanup
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          GOTOOLCHAIN: local
          SECRET_REQUIRE_WINCRED: "1"
        run: |
          $env:SECRET_WINCRED_TARGETS = Join-Path $env:RUNNER_TEMP 'secret-wincred-targets.jsonl'
          go test -v -count=1 -run '^TestWincredCleanup$' ./internal/backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Windows policy package
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 45
        env:
          GOTRACEBACK: all
        # Stream subtests and timeout stacks. Disposable filesystem inputs are not
        # reusable test results; avoid cmd/go rechecking their log after printing ok.
        run: go test -v -count=1 -timeout 40m ./internal/hook/policy/
      - name: Test Go packages
        shell: bash
        env:
          SECRET_REQUIRE_WINDOWS_CLIPBOARD: ${{ runner.os == 'Windows' && '1' || '0' }}
        # Policy has its own Windows step; other packages retain the same deadline.
        # Caching makes cmd/go replay millions of logged fixture stats after each
        # package on Windows; -count=1 removes that replay without skipping tests.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go list ./... | grep -v '^github.com/avhn/secret/internal/hook/policy$' | xargs go test -count=1 -timeout 30m
          else
            go test -timeout 30m ./...
          fi
      - name: Compare Bash store goldens
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          bash testdata/store/gen.sh "$tmp/store"
          diff -ru testdata/store/golden "$tmp/store"
          bash testdata/cli/gen.sh "$tmp/cli"
          diff -ru testdata/cli/golden "$tmp/cli"
      - name: Race test Go packages
        shell: bash
        env:
          CGO_ENABLED: "1"
        # The corpus replay is single-goroutine; Windows race builds run it too slowly to be useful.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go test -race -count=1 -timeout 30m -skip '^TestGuardDeniedCorpus$' ./...
          else
            go test -race -timeout 30m ./...
          fi
      - name: Bounded feature fuzzing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in FuzzMetadataSelection FuzzPrivateImporterJSON FuzzMCPProtocol; do
            go test ./internal/feature -run '^$' -fuzz "^$target$" -fuzztime=15s -parallel=2
          done
      - name: Bounded age fuzzing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test ./internal/store -run '^$' -fuzz '^FuzzAgeEnvelope$' -fuzztime=15s -parallel=2
          for target in FuzzAgeDecrypt FuzzAgeKeyFiles; do
            go test ./internal/backend -run '^$' -fuzz "^$target$" -fuzztime=15s -parallel=2
          done
      - name: Check module files
        shell: bash
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Scan reachable Go vulnerabilities
        if: runner.os == 'Linux'
        shell: bash
        # Fails on any known vulnerability reachable from our code, including the
        # standard library of the pinned toolchain.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Cross-compile Go binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-local
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist-local/secret-$os-$arch$suffix" ./cmd/secret
            done
          done
