name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/secret hooks/guard-secrets tests/*.sh testdata/store/gen.sh testdata/cli/gen.sh
      - run: python3 -I tests/test-go-divergence.py

  libsecret:
    name: libsecret (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Secret Service test dependencies
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Build Go CLI for provider suite
        run: go build -o "$RUNNER_TEMP/secret-go" ./cmd/secret
      - name: Go libsecret suite
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: bash tests/go-cli.sh libsecret "$RUNNER_TEMP/secret-go"
      - name: Isolated libsecret suite
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: SECRET_TEST_INVENTORY="$RUNNER_TEMP/libsecret-cases.tsv" bash tests/test-libsecret.sh
      - name: Isolated Go libsecret integration
        env:
          SECRET_REQUIRE_LIBSECRET: "1"
        run: go test -v ./internal/backend -run '^TestLibsecretIntegration$' -count=1
      - name: Check libsecret inventory
        run: bash tests/inventory.sh --check --suite libsecret

  keychain:
    name: keychain (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Identify missing Keychain inventory
        id: missing_keychain
        run: |
          if [ ! -f testdata/inventory/keychain.tsv ]; then echo "missing=true" >>"$GITHUB_OUTPUT"; fi
      - name: Build Go CLI for provider suite
        run: go build -o "$RUNNER_TEMP/secret-go" ./cmd/secret
      - name: Go Keychain suite
        env:
          SECRET_REQUIRE_KEYCHAIN: "1"
        run: bash tests/go-cli.sh keychain "$RUNNER_TEMP/secret-go"
      - name: Isolated Keychain suite
        run: SECRET_TEST_INVENTORY="$RUNNER_TEMP/keychain-cases.tsv" SECRET_REQUIRE_KEYCHAIN=1 bash tests/test-keychain.sh
      - name: Isolated Go Keychain integration
        env:
          SECRET_REQUIRE_KEYCHAIN: "1"
        run: go test -v ./internal/backend -run '^TestKeychainIntegration$' -count=1
      - name: Check keychain inventory
        env:
          SECRET_INVENTORY_STRICT: "1"
        run: bash tests/inventory.sh --check --suite keychain
      - name: Generate missing keychain inventory artifact
        if: steps.missing_keychain.outputs.missing == 'true'
        run: bash tests/inventory.sh --write --suite keychain
      - uses: actions/upload-artifact@v4
        if: steps.missing_keychain.outputs.missing == 'true'
        with:
          name: keychain-inventory
          path: testdata/inventory/keychain.tsv
          if-no-files-found: error

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install bash ripgrep; else sudo apt-get install -y ripgrep; fi
      # Explicit path: macOS runners put stock /bin/bash 3.2 first on PATH.
      - name: Select current bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then echo "BASH_BIN=$(brew --prefix)/bin/bash" >>"$GITHUB_ENV"; else echo "BASH_BIN=bash" >>"$GITHUB_ENV"; fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build Go CLI suites
        run: |
          go build -o "$RUNNER_TEMP/secret-go" ./cmd/secret
          go build -tags secretstub -o "$RUNNER_TEMP/secret-go-stub" ./cmd/secret
      - name: Go CLI matrix
        run: BASH_BIN="$BASH_BIN" bash tests/go-cli.sh secret "$RUNNER_TEMP/secret-go"
      - name: Go backend matrix
        run: BASH_BIN="$BASH_BIN" bash tests/go-cli.sh backends "$RUNNER_TEMP/secret-go-stub"
      - name: CLI matrix
        run: '"$BASH_BIN" tests/test-secret.sh'
      - name: Backend matrix
        run: '"$BASH_BIN" tests/test-backends.sh'
      - name: Guard matrix
        run: '"$BASH_BIN" tests/test-guard.sh'
      - name: Codex guard matrix
        run: '"$BASH_BIN" tests/test-codex.sh'
      - name: Go Claude hook divergence matrix
        if: runner.os == 'Linux'
        run: BASH_BIN="$BASH_BIN" bash tests/go-hook.sh guard "$RUNNER_TEMP/secret-go" claude
      - name: Go Codex hook divergence matrix
        if: runner.os == 'Linux'
        run: BASH_BIN="$BASH_BIN" bash tests/go-hook.sh codex "$RUNNER_TEMP/secret-go" codex
      - name: Check synthetic inventory
        run: BASH_BIN="$BASH_BIN" bash tests/inventory.sh --check
      - name: Stock bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          /bin/bash tests/test-secret.sh
          /bin/bash tests/test-backends.sh
          /bin/bash tests/test-guard.sh
          /bin/bash tests/test-codex.sh
          BASH_BIN=/bin/bash bash tests/inventory.sh --check

  go:
    name: go (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: true
          cache-dependency-path: go.mod
      - name: Check gofmt
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet Go packages
        shell: bash
        run: go vet ./...
      - name: Test Windows policy package
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 30
        env:
          GOTRACEBACK: all
        # Stream subtest names and timeout stacks instead of buffering a hung package.
        run: go test -v -timeout 25m ./internal/hook/policy/
      - name: Test Go packages
        shell: bash
        # The denied-command corpus replays about 2000 fixture trees; Windows needs more than the default.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go list ./... | grep -v '^github.com/avhn/secret/internal/hook/policy$' | xargs go test -timeout 30m
          else
            go test -timeout 30m ./...
          fi
      - name: Compare Bash store goldens
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          bash testdata/store/gen.sh "$tmp/store"
          diff -ru testdata/store/golden "$tmp/store"
          bash testdata/cli/gen.sh "$tmp/cli"
          diff -ru testdata/cli/golden "$tmp/cli"
      - name: Race test Go packages
        shell: bash
        env:
          CGO_ENABLED: "1"
        # The corpus replay is single-goroutine; Windows race builds run it too slowly to be useful.
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            go test -race -timeout 30m -skip '^TestGuardDeniedCorpus$' ./...
          else
            go test -race -timeout 30m ./...
          fi
      - name: Check module files
        shell: bash
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Cross-compile Go binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist-local
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              suffix=""
              if [ "$os" = windows ]; then suffix=".exe"; fi
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "dist-local/secret-$os-$arch$suffix" ./cmd/secret
            done
          done
