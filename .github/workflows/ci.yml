name: diag
on:
  pull_request:
permissions:
  contents: read
jobs:
  win-fuzz:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Full Windows policy package
        env:
          GOTRACEBACK: all
        run: go test -v -count=1 -timeout 40m -cpuprofile policy.cpu -o policy.test.exe ./internal/hook/policy/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-policy-profile
          path: |
            policy.cpu
            policy.test.exe
