name: release

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

# Candidates only build and compare. Final-tag provenance is never borrowed from
# a candidate run. Repository administrators must restrict release-publish to the
# v0.4.1 tag. The owner approval gate (required reviewers) is disabled by
# default; reactivate it by setting vars.SECRET_RELEASE_APPROVAL_GATE to
# "enabled" and adding required reviewers. A sole maintainer then approves their
# own deployment, which keeps the draft a separate human action.
jobs:
  release-rehearsal:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.10'
          cache: false
      - name: Rebuild dead tag and rehearse genuine public provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GOTOOLCHAIN: local
        run: |
          TMPDIR="$(mktemp -d "$RUNNER_TEMP/release-rehearsal.XXXXXX")"
          export TMPDIR
          python3 -I scripts/rehearse-release.py

  release-build-a:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source-a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Check pinned packaging tools
        run: |
          test "$(node --version)" = v26.10.0
          test "$(python3 --version)" = 'Python 3.14.8'
          xcrun --find lipo
      - name: Independent build A
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          TMPDIR="$(mktemp -d "$RUNNER_TEMP/release-a.XXXXXX")"
          export TMPDIR
          export HOME="$TMPDIR/home" XDG_CACHE_HOME="$TMPDIR/cache"
          export GOCACHE="$TMPDIR/go-cache" GOMODCACHE="$TMPDIR/go-modules"
          mkdir -p "$HOME" "$XDG_CACHE_HOME"
          npm install --global --prefix "$TMPDIR/tools" --ignore-scripts --no-audit --no-fund npm@11.19.1
          export PATH="$TMPDIR/tools/bin:$PATH"
          test "$(npm --version)" = 11.19.1
          sh source-a/scripts/build-release.sh "$RUNNER_TEMP/build-a/assets"
          # Fresh advisories against the lock build-release.sh just installed.
          report="$TMPDIR/npm-audit.json"
          status=0
          npm audit --prefix source-a/packaging/mcpb --ignore-scripts --json > "$report" || status=$?
          case "$status" in 0|1) ;; *) echo "npm audit failed with status $status" >&2; exit 1 ;; esac
          version="$(sh source-a/scripts/verify-release.sh --version)"
          python3 -I source-a/scripts/package_mcpb.py --version "$version" --audit-report "$report"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-a
          path: ${{ runner.temp }}/build-a/assets/
          if-no-files-found: error

  release-build-b:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: independently/nested/source-b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.10.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14.8'
      - name: Check pinned packaging tools
        run: |
          test "$(node --version)" = v26.10.0
          test "$(python3 --version)" = 'Python 3.14.8'
          xcrun --find lipo
      - name: Independent build B
        env:
          GOTOOLCHAIN: local
          GOFLAGS: ''
        run: |
          TMPDIR="$(mktemp -d "$RUNNER_TEMP/release-b.XXXXXX")"
          export TMPDIR
          export HOME="$TMPDIR/home" XDG_CACHE_HOME="$TMPDIR/cache"
          export GOCACHE="$TMPDIR/go-cache" GOMODCACHE="$TMPDIR/go-modules"
          mkdir -p "$HOME" "$XDG_CACHE_HOME"
          npm install --global --prefix "$TMPDIR/tools" --ignore-scripts --no-audit --no-fund npm@11.19.1
          export PATH="$TMPDIR/tools/bin:$PATH"
          test "$(npm --version)" = 11.19.1
          sh independently/nested/source-b/scripts/build-release.sh "$RUNNER_TEMP/other/build-b/assets"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-build-b
          path: ${{ runner.temp }}/other/build-b/assets/
          if-no-files-found: error

  release-repro:
    needs: [release-build-a, release-build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore and check annotated release tag
        if: github.event_name == 'push'
        run: |
          test "$GITHUB_REF" = refs/tags/v0.4.1
          git fetch --no-tags --force origin "refs/tags/v0.4.1:refs/tags/v0.4.1"
          test "$(git cat-file -t refs/tags/v0.4.1)" = tag
          test "$(git rev-parse 'refs/tags/v0.4.1^{commit}')" = "$GITHUB_SHA"
      - name: Check release scripts and synthetic regressions
        run: |
          sh -n scripts/build-release.sh scripts/verify-release.sh
          shellcheck scripts/build-release.sh scripts/verify-release.sh
          python3 -I tests/test-release.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-a
          path: artifacts-a
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-build-b
          path: artifacts-b
      - name: Compare all eight payloads and sorted checksum manifest
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sh scripts/verify-release.sh --source
          sh scripts/verify-release.sh --checksums "$PWD/artifacts-a"
          sh scripts/verify-release.sh --checksums "$PWD/artifacts-b"
          test "$(find artifacts-a -type f | wc -l)" -eq 9
          test "$(find artifacts-b -type f | wc -l)" -eq 9
          for asset in artifacts-a/*; do
            cmp "$asset" "artifacts-b/$(basename "$asset")"
          done
          if [ "$EVENT_NAME" = push ]; then
            cmp dist/checksums-v0.4.1.txt artifacts-a/checksums-v0.4.1.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reproducible
          path: artifacts-a/
          if-no-files-found: error

  release-attest:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.4.1' && github.repository == 'avhn/secret'
    needs: release-repro
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-reproducible
          path: assets
      # Reviewed composite action: the fixed revision generates SLSA v1 build
      # provenance and invokes actions/attest. Subject paths contain only the
      # eight compared payloads and their compared checksum asset (nine subjects).
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: assets/*

  release-verify:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.4.1' && github.repository == 'avhn/secret'
    needs: release-attest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore and check annotated release tag
        run: |
          test "$GITHUB_REF" = refs/tags/v0.4.1
          git fetch --no-tags --force origin "refs/tags/v0.4.1:refs/tags/v0.4.1"
          test "$(git cat-file -t refs/tags/v0.4.1)" = tag
          test "$(git rev-parse 'refs/tags/v0.4.1^{commit}')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-reproducible
          path: assets
      - name: Verify final C, tag, certificate, workflow and all nine subjects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/verify-release.sh "$PWD/assets" "$GITHUB_SHA"
          for asset in "$PWD"/assets/secret-v0.4.1-* "$PWD/assets/server.json" "$PWD/assets/checksums-v0.4.1.txt"; do
            scratch="$(mktemp -d "$RUNNER_TEMP/attestation.XXXXXX")"
            (cd "$scratch" && gh attestation download "$asset" --repo avhn/secret)
            cp "$scratch"/sha256:*.jsonl assets/
          done
          sh scripts/verify-release.sh "$PWD/assets" "$GITHUB_SHA" --bundle-dir "$PWD/assets"
      - name: Require exact-tag publication environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/avhn/secret/environments/release-publish --jq \
            '.deployment_branch_policy.custom_branch_policies == true' \
            | grep -qx true
          gh api repos/avhn/secret/environments/release-publish/deployment-branch-policies --jq \
            '[.branch_policies[] | {name, type}] == [{"name": "v0.4.1", "type": "tag"}]' \
            | grep -qx true
      # Owner approval gate, disabled by default. To reactivate it, set the
      # repository variable SECRET_RELEASE_APPROVAL_GATE to "enabled" and add
      # required reviewers to release-publish and registry-publish.
      - name: Require reviewer approval gate when enabled
        if: vars.SECRET_RELEASE_APPROVAL_GATE == 'enabled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/avhn/secret/environments/release-publish --jq \
            '[.protection_rules[] | select(.type == "required_reviewers" and (.reviewers | length) > 0)] | length > 0' \
            | grep -qx true
      # upload-artifact rejects colons in paths. Preserve gh's bundle contents
      # under portable transport names, then restore them in the approved job.
      - name: Encode bundle names for artifact transport
        run: |
          for bundle in assets/sha256:*.jsonl; do
            mv "$bundle" "assets/sha256-${bundle#assets/sha256:}"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-verified
          path: assets/
          if-no-files-found: error

  release-publish:
    if: github.event_name == 'push' && github.ref == 'refs/tags/v0.4.1' && github.repository == 'avhn/secret'
    needs: release-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore and check annotated release tag
        run: |
          test "$GITHUB_REF" = refs/tags/v0.4.1
          git fetch --no-tags --force origin "refs/tags/v0.4.1:refs/tags/v0.4.1"
          test "$(git cat-file -t refs/tags/v0.4.1)" = tag
          test "$(git rev-parse 'refs/tags/v0.4.1^{commit}')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-verified
          path: assets
      - name: Restore gh bundle names after artifact transport
        run: |
          for bundle in assets/sha256-*.jsonl; do
            mv "$bundle" "assets/sha256:${bundle#assets/sha256-}"
          done
      - name: Reverify approved assets and create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/verify-release.sh "$PWD/assets" "$GITHUB_SHA" --bundle-dir "$PWD/assets"
          # GitHub can normalize special characters in release asset names too.
          # Upload portable bundle names, then restore only the downloaded copies.
          for bundle in assets/sha256:*.jsonl; do
            mv "$bundle" "assets/sha256-${bundle#assets/sha256:}"
          done
          gh release create v0.4.1 --repo avhn/secret --verify-tag --target "$GITHUB_SHA" \
            --draft --title 'secret v0.4.1' \
            --notes 'Reproducible Linux/macOS/Windows binaries, MCPB and registry metadata verified against final-tag C provenance. Publication requires separate owner approval.' \
            assets/secret-v0.4.1-* assets/server.json assets/checksums-v0.4.1.txt assets/sha256-*.jsonl
          scratch="$(mktemp -d "$RUNNER_TEMP/draft-assets.XXXXXX")"
          gh release download v0.4.1 --repo avhn/secret --dir "$scratch"
          test "$(find "$scratch" -type f | wc -l)" -eq 18
          for asset in assets/secret-v0.4.1-* assets/server.json assets/checksums-v0.4.1.txt assets/sha256-*.jsonl; do
            cmp "$asset" "$scratch/$(basename "$asset")"
          done
          for bundle in "$scratch"/sha256-*.jsonl; do
            mv "$bundle" "$scratch/sha256:${bundle##*/sha256-}"
          done
          sh scripts/verify-release.sh "$scratch" "$GITHUB_SHA" --bundle-dir "$scratch"
          # Deliberately no `gh release edit --draft=false`: publishing is a
          # separate irreversible owner action, not a consequence of a tag push.
